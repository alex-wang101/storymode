[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stamped-video"
dynamic = ["version"]
description = "Python client for the Stamped brand-detection API."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Wang" }]
keywords = ["video", "object-detection", "brand-detection", "api", "sdk", "client"]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Add your repo URL here so it shows on the PyPI project page:
# [project.urls]
# Homepage = "https://github.com/<you>/<repo>"

[tool.hatch.version]
path = "src/stamped/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stamped"]
